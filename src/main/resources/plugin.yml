name: Kernel
version: '1.0.0-SNAPSHOT'
main: com.earthpol.kernel.Kernel
api-version: '1.21'
folia-supported: true
softdepend: [Vault, VaultUnlocked]

commands:
  kernel:
    description: Kernel admin commands.
    usage: /kernel reload
    permission: kernel.command.kernel
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
    permission: kernel.command.home
  sethome:
    description: Set a home at your current location.
    usage: /sethome [name]
    permission: kernel.command.sethome
  delhome:
    description: Delete one of your homes.
    usage: /delhome [name]
    permission: kernel.command.delhome
  tpa:
    description: Request a teleport to another player.
    usage: /tpa <player>
    permission: kernel.command.tpa
  tpaccept:
    description: Accept the latest teleport request.
    usage: /tpaccept
    permission: kernel.command.tpaccept
  tpdeny:
    description: Deny the latest teleport request.
    usage: /tpdeny
    permission: kernel.command.tpdeny
  back:
    description: Return to your previous death or teleport location.
    usage: /back
    permission: kernel.command.back
  msg:
    description: Send a private message.
    usage: /msg <player> <message>
    aliases: [tell, whisper, w]
    permission: kernel.command.msg
  r:
    description: Reply to the last private message.
    usage: /r <message>
    aliases: [reply]
    permission: kernel.command.reply
  ignore:
    description: Ignore or unignore a player.
    usage: /ignore <player>
    permission: kernel.command.ignore
  mail:
    description: Send offline mail.
    usage: /mail send <player> <message>
    permission: kernel.command.mail
  heal:
    description: Restore your health.
    usage: /heal [player]
    permission: kernel.command.heal
  feed:
    description: Restore your hunger.
    usage: /feed
    permission: kernel.command.feed
  clearinventory:
    description: Clear your inventory.
    usage: /clearinventory
    aliases: [ci, clearinv]
    permission: kernel.command.clearinventory
  bal:
    description: Check a balance.
    usage: /bal [player]
    aliases: [balance, money]
    permission: kernel.command.bal
  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
    permission: kernel.command.pay
  baltop:
    description: View the richest players.
    usage: /baltop
    permission: kernel.command.baltop
  eco:
    description: Admin economy controls.
    usage: /eco <give|take|set> <player> <amount>
    permission: kernel.command.eco
  gamemode:
    description: Change a gamemode.
    usage: /gamemode <mode> [player]
    aliases: [gm]
    permission: kernel.command.gamemode
  gmc:
    description: Change to creative mode.
    usage: /gmc [player]
    permission: kernel.command.gamemode.creative
  gms:
    description: Change to survival mode.
    usage: /gms [player]
    permission: kernel.command.gamemode.survival
  gma:
    description: Change to adventure mode.
    usage: /gma [player]
    permission: kernel.command.gamemode.adventure
  gmsp:
    description: Change to spectator mode.
    usage: /gmsp [player]
    permission: kernel.command.gamemode.spectator
  fly:
    description: Toggle flight.
    usage: /fly [player]
    permission: kernel.command.fly
  god:
    description: Toggle invulnerability.
    usage: /god [player]
    permission: kernel.command.god
  speed:
    description: Set your walk or fly speed.
    usage: /speed <speed|default> or /speed <walk|fly> <speed|default>
    permission: kernel.command.speed
  tp:
    description: Teleport to a player or coordinates.
    usage: /tp <player|selector>|<targets> <destination>|<x|~offset> <y|~offset> <z|~offset>|<player|selector> <x|~offset> <y|~offset> <z|~offset>
    permission: kernel.command.tp
  tppos:
    description: Teleport to coordinates.
    usage: /tppos <x|~offset> <y|~offset> <z|~offset>
    permission: kernel.command.tppos
  tphere:
    description: Teleport a player to you.
    usage: /tphere <player>
    permission: kernel.command.tphere
  tptoggle:
    description: Toggle teleport requests and direct teleports to you.
    usage: /tptoggle
    permission: kernel.command.tptoggle
  tpo:
    description: Teleport to a player while bypassing teleport toggle.
    usage: /tpo <player>
    permission: kernel.command.tpo
  nick:
    description: Set a nickname.
    usage: /nick <name|reset> or /nick <player> <name|reset>
    permission: kernel.command.nick
  seen:
    description: Check when a player was last seen.
    usage: /seen <player>
    permission: kernel.command.seen
  socialspy:
    description: Toggle social spy.
    usage: /socialspy
    aliases: [ss]
    permission: kernel.command.socialspy
  trim:
    description: Apply an armor trim to your equipped armor.
    usage: /trim <type> <material> [head|chest|legs|feet]
    permission: kernel.command.trim
  hat:
    description: Put the item in your hand on your head.
    usage: /hat
    permission: kernel.command.hat
  sudo:
    description: Force a player to execute a command.
    usage: /sudo <player|*> <command>
    permission: kernel.command.sudo
  smite:
    description: Strike lightning at a player.
    usage: /smite <player>
    aliases: [lightning]
    permission: kernel.command.smite
  workbench:
    description: Open a portable crafting table.
    usage: /workbench
    aliases: [craft, wb, wbench]
    permission: kernel.command.workbench
  stonecutter:
    description: Open a portable stonecutter.
    usage: /stonecutter
    permission: kernel.command.stonecutter
  cartographytable:
    description: Open a portable cartography table.
    usage: /cartographytable
    aliases: [carttable]
    permission: kernel.command.cartographytable
  smithingtable:
    description: Open a portable smithing table.
    usage: /smithingtable
    aliases: [smithtable]
    permission: kernel.command.smithingtable
  grindstone:
    description: Open a portable grindstone.
    usage: /grindstone
    permission: kernel.command.grindstone
  loom:
    description: Open a portable loom.
    usage: /loom
    permission: kernel.command.loom
  enderchest:
    description: Open your ender chest.
    usage: /enderchest [player]
    aliases: [ec, echest, endersee]
    permission: kernel.command.enderchest
  anvil:
    description: Open a portable anvil.
    usage: /anvil
    permission: kernel.command.anvil

